<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Pembagian</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #4a6cf7;
            --primary-hover: #3651d5;
            --accent: #10b981;
            --danger: #ef4444;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #f0f4f8 30%, #eef1f8 70%, #e3e9f3 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow), 0 1px 3px rgba(0, 0, 0, 0.04);
            padding: 32px 28px 28px;
            transition: all var(--transition);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header .icon {
            font-size: 42px;
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .header p {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* Form Setup */
        .setup-form {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-end;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            margin-bottom: 22px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 140px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .form-group input {
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border var(--transition), box-shadow var(--transition);
            background: #fff;
            outline: none;
            color: var(--text);
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
        }
        .btn-start {
            padding: 11px 22px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
            flex-shrink: 0;
        }
        .btn-start:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(74, 108, 247, 0.25);
        }
        .btn-start:active {
            transform: scale(0.97);
        }
        .btn-start:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Info bar */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            padding: 0 2px;
        }
        .student-name {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
            background: #eef2ff;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .student-name span {
            font-size: 1rem;
        }
        .question-count {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
        }

        /* Soal cards */
        .questions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (max-width: 550px) {
            .questions-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px 14px 18px;
            }
            .setup-form {
                padding: 14px;
                gap: 10px;
            }
        }
        .question-card {
            background: #fafbfc;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all var(--transition);
            position: relative;
        }
        .question-card.correct {
            border-color: var(--accent);
            background: #f0fdf6;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.06);
        }
        .question-card.wrong {
            border-color: var(--danger);
            background: #fef5f5;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.06);
        }
        .question-card .q-number {
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-light);
            background: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--border);
            flex-shrink: 0;
        }
        .question-card .q-expression {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            letter-spacing: 0.2px;
            flex-shrink: 0;
        }
        .question-card .q-expression .divide-symbol {
            color: var(--primary);
            margin: 0 2px;
        }
        .question-card input {
            width: 70px;
            padding: 9px 10px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            font-family: inherit;
            transition: all var(--transition);
            background: #fff;
            outline: none;
            color: var(--text);
        }
        .question-card input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.08);
        }
        .question-card input.correct-input {
            border-color: var(--accent);
            background: #f0fdf6;
            color: #059669;
        }
        .question-card input.wrong-input {
            border-color: var(--danger);
            background: #fef5f5;
            color: #dc2626;
        }
        .question-card .feedback-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .question-card .feedback-icon.show {
            opacity: 1;
        }
        .question-card .correct-answer {
            font-size: 0.78rem;
            color: #059669;
            font-weight: 500;
            display: none;
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 2px 10px;
            border-radius: 10px;
            white-space: nowrap;
            border: 1px solid #d1fae5;
        }
        .question-card.wrong .correct-answer {
            display: block;
        }

        /* Action buttons */
        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            font-family: inherit;
            letter-spacing: 0.2px;
            transition: all var(--transition);
        }
        .btn-check {
            background: var(--accent);
            color: #fff;
        }
        .btn-check:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.25);
        }
        .btn-reset {
            background: #fff;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-reset:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Score */
        .score-display {
            text-align: center;
            margin-top: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            min-height: 28px;
            transition: all var(--transition);
        }
        .score-display.great {
            color: #059669;
        }
        .score-display.good {
            color: #d97706;
        }
        .score-display.needs-practice {
            color: #dc2626;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon">📐</div>
            <h1>Latihan Pembagian</h1>
            <p>Dividen ratusan–ribuan & Pembagi satuan–puluhan</p>
        </div>

        <!-- Setup Form -->
        <div class="setup-form" id="setupForm">
            <div class="form-group">
                <label for="studentName">👤 Nama Kamu</label>
                <input type="text" id="studentName" placeholder="Masukkan nama..." autocomplete="off">
            </div>
            <button class="btn-start" id="btnGenerate" onclick="generateQuestions()">
                🚀 Mulai Latihan
            </button>
        </div>

        <!-- Info setelah generate -->
        <div class="info-bar hidden" id="infoBar">
            <div class="student-name">
                <span>👤</span> <span id="displayName"></span>
            </div>
            <div class="question-count">📝 <strong>10 Soal</strong> • Pembagian Tanpa Sisa</div>
        </div>

        <!-- Grid Soal -->
        <div class="questions-grid hidden" id="questionsGrid"></div>

        <!-- Tombol aksi -->
        <div class="action-row hidden" id="actionRow">
            <button class="btn btn-check" id="btnCheck" onclick="checkAnswers()">✅ Periksa Jawaban</button>
            <button class="btn btn-reset" onclick="resetAll()">🔄 Ulang / Ganti Soal</button>
        </div>

        <!-- Skor -->
        <div class="score-display hidden" id="scoreDisplay"></div>
    </div>

    <script>
        // Data soal yang digenerate
        let questions = [];
        let isChecked = false;

        /**
         * Generate 10 soal pembagian:
         * - Dividen (yang dibagi): 100 s.d. 9999 (ratusan ~ ribuan)
         * - Pembagi: 1 s.d. 99 (satuan ~ puluhan)
         * - Hasil bagi: bilangan bulat (tanpa sisa)
         */
        function generateQuestions() {
            const nameInput = document.getElementById('studentName');
            const studentName = nameInput.value.trim();

            if (!studentName) {
                alert('⚠️ Silakan isi nama kamu terlebih dahulu!');
                nameInput.focus();
                nameInput.style.borderColor = '#ef4444';
                setTimeout(() => { nameInput.style.borderColor = ''; }, 1500);
                return;
            }

            // Reset pengecekan
            isChecked = false;

            // Generate 10 soal unik
            questions = [];
            const usedPairs = new Set(); // hindari duplikat soal

            while (questions.length < 10) {
                const pembagi = randomInt(1, 99); // satuan sampai puluhan (1-99)

                // Tentukan rentang hasil bagi agar dividen tetap di 100–9999
                const minQuotient = Math.ceil(100 / pembagi);
                const maxQuotient = Math.floor(9999 / pembagi);

                // Jika rentang valid
                if (minQuotient <= maxQuotient) {
                    const hasilBagi = randomInt(minQuotient, maxQuotient);
                    const dividen = pembagi * hasilBagi;

                    // Pastikan dividen dalam range yang diinginkan
                    if (dividen >= 100 && dividen <= 9999) {
                        const pairKey = `${dividen}|${pembagi}`;
                        if (!usedPairs.has(pairKey)) {
                            usedPairs.add(pairKey);
                            questions.push({
                                dividen: dividen,
                                pembagi: pembagi,
                                jawabanBenar: hasilBagi,
                            });
                        }
                    }
                }
                // Safety: kalau somehow loop terlalu lama, break setelah 5000 iterasi
                if (usedPairs.size > 5000) break;
            }

            // Fallback: kalau kurang dari 10 (sangat tidak mungkin), isi manual
            if (questions.length < 10) {
                const fallback = [
                    { dividen: 144, pembagi: 12, jawabanBenar: 12 },
                    { dividen: 250, pembagi: 5, jawabanBenar: 50 },
                    { dividen: 1000, pembagi: 25, jawabanBenar: 40 },
                    { dividen: 369, pembagi: 3, jawabanBenar: 123 },
                    { dividen: 720, pembagi: 8, jawabanBenar: 90 },
                    { dividen: 1500, pembagi: 30, jawabanBenar: 50 },
                    { dividen: 847, pembagi: 7, jawabanBenar: 121 },
                    { dividen: 6000, pembagi: 60, jawabanBenar: 100 },
                    { dividen: 999, pembagi: 9, jawabanBenar: 111 },
                    { dividen: 500, pembagi: 50, jawabanBenar: 10 },
                ];
                questions = fallback.slice(0, 10);
            }

            // Tampilkan UI
            document.getElementById('displayName').textContent = studentName;
            document.getElementById('infoBar').classList.remove('hidden');
            document.getElementById('questionsGrid').classList.remove('hidden');
            document.getElementById('actionRow').classList.remove('hidden');
            document.getElementById('scoreDisplay').classList.add('hidden');
            document.getElementById('btnGenerate').disabled = true;
            document.getElementById('btnGenerate').textContent = '✅ Soal Siap';

            renderQuestions();
        }

        function renderQuestions() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${index}`;
                card.innerHTML = `
                    <div class="q-number">${index + 1}</div>
                    <div class="q-expression">
                        ${q.dividen.toLocaleString('id-ID')}
                        <span class="divide-symbol">÷</span>
                        ${q.pembagi}
                        <span style="margin:0 3px;">=</span>
                    </div>
                    <input
                        type="number"
                        id="answer-${index}"
                        placeholder="?"
                        autocomplete="off"
                        onkeydown="if(event.key==='Enter'){document.getElementById('btnCheck').click();}"
                    >
                    <span class="feedback-icon" id="icon-${index}"></span>
                    <span class="correct-answer" id="correct-label-${index}">
                        Jawaban: ${q.jawabanBenar.toLocaleString('id-ID')}
                    </span>
                `;
                grid.appendChild(card);
            });

            // Fokus ke input pertama
            setTimeout(() => {
                const firstInput = document.getElementById('answer-0');
                if (firstInput) firstInput.focus();
            }, 150);
        }

        function checkAnswers() {
            if (questions.length === 0) return;

            let correctCount = 0;
            const total = questions.length;
            isChecked = true;

            questions.forEach((q, index) => {
                const inputEl = document.getElementById(`answer-${index}`);
                const cardEl = document.getElementById(`card-${index}`);
                const iconEl = document.getElementById(`icon-${index}`);
                const correctLabelEl = document.getElementById(`correct-label-${index}`);

                const userAnswer = parseInt(inputEl.value.trim(), 10);
                const isCorrect = (userAnswer === q.jawabanBenar);

                // Reset styling
                inputEl.classList.remove('correct-input', 'wrong-input');
                cardEl.classList.remove('correct', 'wrong');
                iconEl.classList.remove('show');
                iconEl.textContent = '';

                if (isNaN(userAnswer) || inputEl.value.trim() === '') {
                    // Tidak dijawab
                    cardEl.classList.add('wrong');
                    iconEl.textContent = '❌';
                    iconEl.classList.add('show');
                    inputEl.classList.add('wrong-input');
                } else if (isCorrect) {
                    correctCount++;
                    cardEl.classList.add('correct');
                    iconEl.textContent = '✅';
                    iconEl.classList.add('show');
                    inputEl.classList.add('correct-input');
                } else {
                    cardEl.classList.add('wrong');
                    iconEl.textContent = '❌';
                    iconEl.classList.add('show');
                    inputEl.classList.add('wrong-input');
                }
            });

            // Tampilkan skor
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.classList.remove('hidden', 'great', 'good', 'needs-practice');

            let emoji = '';
            let cssClass = '';
            if (correctCount === total) {
                emoji = '🏆🌟';
                cssClass = 'great';
            } else if (correctCount >= 7) {
                emoji = '👍';
                cssClass = 'good';
            } else if (correctCount >= 5) {
                emoji = '📚';
                cssClass = 'good';
            } else {
                emoji = '💪';
                cssClass = 'needs-practice';
            }

            scoreDisplay.textContent = `${emoji} Skor: ${correctCount} / ${total} benar`;
            scoreDisplay.classList.add(cssClass);

            // Scroll ke score
            scoreDisplay.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetAll() {
            // Reset state
            questions = [];
            isChecked = false;

            // Reset UI
            document.getElementById('infoBar').classList.add('hidden');
            document.getElementById('questionsGrid').classList.add('hidden');
            document.getElementById('questionsGrid').innerHTML = '';
            document.getElementById('actionRow').classList.add('hidden');
            document.getElementById('scoreDisplay').classList.add('hidden');
            document.getElementById('btnGenerate').disabled = false;
            document.getElementById('btnGenerate').textContent = '🚀 Mulai Latihan';
            document.getElementById('studentName').value = '';
            document.getElementById('studentName').focus();

            // Reset form styling
            document.getElementById('studentName').style.borderColor = '';
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Event listener: Enter di input nama langsung generate
        document.getElementById('studentName').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                generateQuestions();
            }
        });

        // Inisial focus
        document.getElementById('studentName').focus();
    </script>
</body>
</html>
