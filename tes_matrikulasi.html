<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Ujian & Latihan Matematika</title>
  <style>
    /* ... (CSS sama persis seperti sebelumnya) ... */
    /* Tidak ada perubahan CSS */
  </style>
</head>
<body>
  <!-- Overlay peringatan fullscreen -->
  <div id="fullscreenWarningOverlay">
    <div class="warning-box">
      <div class="warning-icon">🚫</div>
      <div class="warning-text">JANGAN KELUAR!</div>
      <div class="warning-sub">Mode ujian terkunci.</div>
      <div class="warning-action">Klik di sini untuk kembali</div>
    </div>
  </div>

  <div class="container">
    <!-- ... (header, startScreen, timerBar, part1Card, part2Card, resultCard) ... -->
  </div>

  <div id="fullscreenIndicator">⛓️ Fullscreen aktif</div>
  <div id="secretExitBtn" title="Klik dua kali untuk keluar dari mode ujian">🔓</div>

  <script>
    (function() {
      // ========== FULLSCREEN LOCK SYSTEM (ADAPTIF) ==========
      const warningOverlay = document.getElementById('fullscreenWarningOverlay');
      
      // ** Deteksi apakah perangkat mendukung fullscreen **
      function canFullscreen() {
        const el = document.documentElement;
        return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen);
      }
      
      // ** Hanya aktifkan penguncian jika fullscreen didukung **
      let fullscreenLockActive = canFullscreen();

      function requestFullscreen() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      }

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function updateWarningState() {
        // Jika perangkat tidak bisa fullscreen, jangan lakukan apa pun
        if (!fullscreenLockActive) {
          warningOverlay.style.display = 'none';
          document.getElementById('fullscreenIndicator').style.display = 'none';
          return;
        }
        
        if (!isFullscreen()) {
          warningOverlay.style.display = 'flex';
          document.getElementById('fullscreenIndicator').style.display = 'none';
          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(200);
          }
        } else {
          warningOverlay.style.display = 'none';
          document.getElementById('fullscreenIndicator').style.display = 'block';
        }
      }

      document.addEventListener('fullscreenchange', updateWarningState);
      document.addEventListener('webkitfullscreenchange', updateWarningState);

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          updateWarningState();
        }
      });

      // Klik pada overlay hanya muncul jika fullscreen didukung
      warningOverlay.addEventListener('click', function(e) {
        if (fullscreenLockActive && !isFullscreen()) {
          requestFullscreen();
        }
      });

      warningOverlay.addEventListener('touchmove', function(e) {
        e.preventDefault();
      }, { passive: false });

      // Hanya coba fullscreen jika didukung
      document.addEventListener('click', function initFullscreen() {
        if (fullscreenLockActive && !isFullscreen()) {
          requestFullscreen();
        }
      }, { once: false });

      // Interval pengecekan hanya jika fullscreen aktif
      setInterval(() => {
        if (fullscreenLockActive && !isFullscreen()) {
          updateWarningState();
        }
      }, 500);

      // Tombol keluar rahasia
      let clickTimer = null;
      document.getElementById('secretExitBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        if (clickTimer === null) {
          clickTimer = setTimeout(() => { clickTimer = null; }, 600);
        } else {
          clearTimeout(clickTimer);
          clickTimer = null;
          keluarDariModeUjian();
        }
      });

      function keluarDariModeUjian() {
        const konfirmasi = confirm(
          '⚠️ Apakah Anda yakin ingin keluar dari mode ujian?\n\n' +
          '• Fullscreen akan dilepas (jika sedang aktif).\n' +
          '• Data nama akan dihapus dari browser.\n' +
          '• Anda dapat menutup halaman dengan bebas.'
        );
        if (!konfirmasi) return;
        
        fullscreenLockActive = false;
        warningOverlay.style.display = 'none';
        
        if (isFullscreen()) {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
        
        localStorage.removeItem('latihanUjianNama');
        document.getElementById('inputNama').value = '';
        document.getElementById('inputNama').disabled = false;
        document.getElementById('fullscreenIndicator').style.display = 'none';
        alert('✅ Mode ujian telah berakhir. Data nama telah dihapus. Anda sekarang bisa menutup halaman.');
      }

      // ... (sisanya sama: utility, generate soal, timer, dll.) ...
      // Semua fungsi soal, timer, review tetap sama tanpa perubahan.
      // Pastikan di startMode tidak ada pemaksaan fullscreen.
      // Di startMode kita tetap panggil requestFullscreen hanya jika fullscreenLockActive true,
      // tapi sebaiknya biarkan saja karena sudah ada listener global.
      
      // Contoh kecil penyesuaian di startMode (tambahan jika diperlukan):
      window.startMode = function(selectedMode) {
        // ... kode asli startMode ...
        // Hapus pemanggilan requestFullscreen manual (tidak ada di kode awal, jadi aman)
      };
      
      // ... (review, timer, dll.) ...
    })();
  </script>
</body>
</html>
