<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cari Kotak GPS PRO FINAL</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
  margin:0;
  font-family:'Segoe UI';
}

#map{
  height:100vh;
}

/* PANEL */

.panel{
  position:fixed;
  top:10px;
  right:10px;
  width:320px;
  background:white;
  padding:14px;
  border-radius:12px;
  box-shadow:0 6px 25px rgba(0,0,0,0.3);
  z-index:1000;
  max-height:95vh;
  overflow:auto;
  transition:0.3s;
}

/* MINIMIZE PANEL */

.panel.minimized{
  width:60px;
  height:60px;
  overflow:hidden;
  padding:0;
  border-radius:50%;
}

.panel.minimized .panelContent{
  display:none;
}

#togglePanelBtn{
  position:absolute;
  top:8px;
  left:8px;
  width:40px;
  height:40px;
  border-radius:50%;
  border:none;
  background:#333;
  color:white;
  font-size:20px;
  cursor:pointer;
  z-index:2000;
}

button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

input[type="number"],
input[type="text"]{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
  margin-bottom:8px;
}

.btn-admin{
  background:#f0ad4e;
  color:white;
}

.btn-import{
  background:#5bc0de;
  color:white;
}

.btn-start{
  background:#4CAF50;
  color:white;
}

.btn-export{
  background:#ff9800;
  color:white;
}

.hidden{
  display:none;
}

.found{
  text-decoration:line-through;
  color:green;
}

#timerDisplay{
  margin-top:10px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  color:#e91e63;
  padding:10px;
  background:#f5f5f5;
  border-radius:10px;
}

.settingBox{
  margin-top:10px;
  padding:10px;
  background:#f7f7f7;
  border-radius:10px;
}

#playerInfo{
  margin-top:8px;
  padding:10px;
  background:#f5f5f5;
  border-radius:10px;
  font-weight:bold;
}

</style>
</head>

<body>

<div id="map"></div>

<!-- PANEL -->

<div class="panel" id="mainPanel">

<button id="togglePanelBtn">
✖
</button>

<div class="panelContent">

<h3>🎮 Mode Player</h3>

<input type="text"
id="gameCode"
placeholder="Masukkan kode game">

<button id="loadGameBtn"
class="btn-import">
🎮 Load Game
</button>

<input type="text"
id="playerName"
placeholder="Masukkan nama pemain">

<button id="startBtn" class="btn-start">
▶️ Mulai Game
</button>

<div id="timerDisplay">
⏳ 00:00
</div>

<div id="playerInfo">
👤 Pemain: -
</div>

<div id="progress">
Progress: 0/10
</div>

<div id="playerList"></div>

<hr>

<button id="adminBtn" class="btn-admin">
🔒 Admin
</button>

<div id="adminPanel" class="hidden">

<h4>🔧 Admin Mode</h4>

<div class="settingBox">

<label>
⏰ Waktu Permainan (menit)
</label>

<input type="number"
id="timerInput"
value="30"
min="1">

</div>

<button id="drawBtn">
✏️ Gambar Area
</button>

<button id="stopBtn">
⏹️ Stop
</button>

<button id="exportBtn" class="btn-export">
📤 Export Game
</button>

</div>

</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const ADMIN_PASSWORD = "1234";

let map;
let polygon=null;
let polygonLayer=null;

let drawing=false;
let path=[];

let allBoxes=[];
let activeBoxes=[];
let unusedBoxes=[];

let playerMarker;
let visibleMarkers=[];
let watchId;

let gameTimer;
let timeLeft=0;
let gameDuration=30;

let currentPlayerName="";
let gameStarted=false;

let mode='player';

// =========================
// INIT
// =========================

function init(){

  map = L.map('map').setView(
    [-8.17,113.7],
    18
  );

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution:'© OpenStreetMap'
    }
  ).addTo(map);

  map.on('click', mapClick);

  setMode('player');

  updateTimerDisplay();
}

window.onload=()=>{

  init();
};

// =========================
// LOAD GAME DARI KODE
// =========================

loadGameBtn.onclick=()=>{

  loadGameFromCode();
};

async function loadGameFromCode(){

  let code=
    gameCode.value.trim();

  if(code===""){

    return alert(
      "Masukkan kode game!"
    );
  }

  code=code.toUpperCase();

  try{

    const response=
      await fetch(code + ".json");

    if(!response.ok){

      alert("Game tidak ditemukan!");

      return;
    }

    const data=
      await response.json();

    allBoxes=
      data.boxes || [];

    gameDuration=
      data.gameDuration || 30;

    timerInput.value=
      gameDuration;

    if(data.polygonPath){

      path=data.polygonPath;

      polygon=path;

      if(polygonLayer){

        map.removeLayer(
          polygonLayer
        );
      }

      polygonLayer=
        L.polygon(path,{

          color:'red',

          fillOpacity:0.2

        }).addTo(map);
    }

    alert(
      "🎮 Game berhasil dimuat!"
    );

  }catch(err){

    console.log(err);

    alert("Gagal load game");
  }
}

// =========================
// MODE
// =========================

function setMode(m){

  mode=m;

  adminPanel.classList.toggle(
    "hidden",
    m!=='admin'
  );

  if(m==='player'){

    map.dragging.disable();
    map.touchZoom.disable();
    map.doubleClickZoom.disable();
    map.scrollWheelZoom.disable();

  }else{

    map.dragging.enable();
    map.touchZoom.enable();
    map.doubleClickZoom.enable();
    map.scrollWheelZoom.enable();
  }
}

// =========================
// ADMIN LOGIN
// =========================

adminBtn.onclick=()=>{

  let pw=prompt("Password admin:");

  if(pw===ADMIN_PASSWORD){

    setMode('admin');

  }else{

    alert("Password salah!");
  }
};

// =========================
// DRAW AREA
// =========================

drawBtn.onclick=()=>{

  drawing=true;

  path=[];

  if(polygonLayer){

    map.removeLayer(polygonLayer);
  }

  alert("Klik minimal 3 titik");
};

stopBtn.onclick=()=>{

  drawing=false;

  if(path.length<3){

    return alert("Minimal 3 titik");
  }

  polygonLayer=L.polygon(path,{
    color:'red',
    fillOpacity:0.2
  }).addTo(map);

  polygon=path;

  alert("Area selesai");
};

// =========================
// MAP CLICK
// =========================

function mapClick(e){

  if(mode!=='admin') return;

  if(drawing){

    path.push([
      e.latlng.lat,
      e.latlng.lng
    ]);

    L.marker(e.latlng).addTo(map);

    return;
  }

  if(!polygon){

    return alert("Buat area dulu");
  }

  if(!insidePolygon(e.latlng, polygon)){

    return alert("Klik di dalam area");
  }

  let q=prompt("Pertanyaan:");

  if(!q) return;

  let a=prompt("Jawaban:");

  if(!a) return;

  allBoxes.push({

    lat:e.latlng.lat,
    lng:e.latlng.lng,

    question:q,

    answer:a.toLowerCase(),

    found:false,
    opened:false
  });

  L.marker(e.latlng).addTo(map);
}

// =========================
// POINT IN POLYGON
// =========================

function insidePolygon(point, vs){

  let x=point.lat;
  let y=point.lng;

  let inside=false;

  for(let i=0,j=vs.length-1;i<vs.length;j=i++){

    let xi=vs[i][0];
    let yi=vs[i][1];

    let xj=vs[j][0];
    let yj=vs[j][1];

    let intersect=
      ((yi>y)!=(yj>y))
      &&
      (x < (xj-xi)*(y-yi)/(yj-yi)+xi);

    if(intersect)
      inside=!inside;
  }

  return inside;
}

// =========================
// EXPORT
// =========================

exportBtn.onclick=()=>{

  if(allBoxes.length===0){

    alert("Belum ada soal!");
    return;
  }

  gameDuration=
    parseInt(timerInput.value)||30;

  const data={

    gameDuration:gameDuration,

    polygonPath:path,

    boxes:allBoxes
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:'application/json'}
  );

  const a=document.createElement('a');

  a.href=URL.createObjectURL(blob);

  let code=prompt(
    "Masukkan kode game:"
  );

  if(!code){

    return;
  }

  code=code.toUpperCase();

  a.download=code + ".json";

  a.click();
};

// =========================
// START GAME
// =========================

startBtn.onclick=()=>{

  const inputName=
    playerName.value.trim();

  if(inputName===""){

    return alert("Masukkan nama pemain!");
  }

  if(!gameStarted){

    currentPlayerName=inputName;

    playerName.value=currentPlayerName;

    playerInfo.textContent=
      "👤 Pemain: "+currentPlayerName;

    playerName.disabled=true;

    gameStarted=true;
  }

  if(allBoxes.length<10){

    return alert("Minimal 10 soal");
  }

  let shuffled=[...allBoxes]
    .sort(()=>Math.random()-0.5);

  activeBoxes=shuffled.slice(0,10);

  unusedBoxes=shuffled.slice(10);

  activeBoxes.forEach(b=>{

    b.found=false;
    b.opened=false;
  });

  updateUI();

  startGameTimer();

  startPlayer();
};

// =========================
// TIMER
// =========================

function startGameTimer(){

  clearInterval(gameTimer);

  gameDuration=
    parseInt(timerInput.value)||30;

  timeLeft=gameDuration*60;

  updateTimerDisplay();

  gameTimer=setInterval(()=>{

    timeLeft--;

    updateTimerDisplay();

    if(timeLeft<=0){

      clearInterval(gameTimer);

      endGame();
    }

  },1000);
}

function updateTimerDisplay(){

  let minutes=
    Math.floor(timeLeft/60);

  let seconds=timeLeft%60;

  let m=
    String(minutes).padStart(2,'0');

  let s=
    String(seconds).padStart(2,'0');

  timerDisplay.textContent=
    `⏳ ${m}:${s}`;
}

// =========================
// GAME OVER
// =========================

function endGame(){

  if(watchId){

    navigator.geolocation.clearWatch(
      watchId
    );
  }

  gameStarted=false;

  playerName.disabled=false;

  alert("⏰ Waktu habis!");
}

// =========================
// PLAYER GPS
// =========================

function startPlayer(){

  if(watchId){

    navigator.geolocation.clearWatch(
      watchId
    );
  }

  watchId=
    navigator.geolocation.watchPosition(

    pos=>{

      let lat=pos.coords.latitude;
      let lng=pos.coords.longitude;

      let me=[lat,lng];

      map.setView(me,20);

      if(!playerMarker){

        playerMarker=L.circleMarker(
          me,
          {
            radius:10
          }
        ).addTo(map);

      }else{

        playerMarker.setLatLng(me);
      }

      updateBoxes(me);

    },

    ()=>alert("GPS error"),

    {
      enableHighAccuracy:true
    }
  );
}

// =========================
// DISTANCE
// =========================

function getDistance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R=6371000;

  const dLat=
    (lat2-lat1)*Math.PI/180;

  const dLon=
    (lon2-lon1)*Math.PI/180;

  const a=

    Math.sin(dLat/2)*
    Math.sin(dLat/2)

    +

    Math.cos(lat1*Math.PI/180)

    *

    Math.cos(lat2*Math.PI/180)

    *

    Math.sin(dLon/2)

    *

    Math.sin(dLon/2);

  return R*2*Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );
}

// =========================
// UPDATE BOX
// =========================

function updateBoxes(me){

  visibleMarkers.forEach(m=>{

    map.removeLayer(m);
  });

  visibleMarkers=[];

  activeBoxes.forEach((box,i)=>{

    if(box.found) return;

    let d=getDistance(

      me[0],
      me[1],

      box.lat,
      box.lng
    );

    if(d<=12){

      let marker=L.marker(

        [box.lat,box.lng],

        {
          icon:L.icon({

            iconUrl:
            'https://cdn-icons-png.flaticon.com/512/3097/3097133.png',

            iconSize:[45,45]
          })
        }

      ).addTo(map);

      visibleMarkers.push(marker);
    }

    if(d<=5 && !box.opened){

      box.opened=true;

      setTimeout(()=>{

        let ans=
          prompt(box.question);

        if(
          ans &&
          ans.toLowerCase()===box.answer
        ){

          box.found=true;

          alert("🎉 Benar!");

        }else{

          alert("❌ Salah!");

          if(unusedBoxes.length>0){

            activeBoxes[i]=
              unusedBoxes.shift();

          }else{

            activeBoxes.splice(i,1);
          }
        }

        updateUI();

        checkWin();

      },200);
    }

  });
}

// =========================
// WIN
// =========================

function checkWin(){

  let found=
    activeBoxes.filter(
      b=>b.found
    ).length;

  if(found>=10){

    clearInterval(gameTimer);

    gameStarted=false;

    playerName.disabled=false;

    alert(
      "🏆 Semua kotak ditemukan!"
    );
  }
}

// =========================
// UI
// =========================

function updateUI(){

  let found=
    activeBoxes.filter(
      b=>b.found
    ).length;

  progress.textContent=
    "Progress: "+found+"/10";

  playerList.innerHTML=

    activeBoxes.map((b,i)=>

    `<div class="${
      b.found?'found':''
    }">

      📦 Soal ${i+1}

    </div>`

  ).join("");
}

// =========================
// MINIMIZE PANEL
// =========================

const mainPanel =
  document.getElementById("mainPanel");

const togglePanelBtn =
  document.getElementById("togglePanelBtn");

let minimized=false;

togglePanelBtn.onclick=()=>{

  minimized=!minimized;

  if(minimized){

    mainPanel.classList.add(
      "minimized"
    );

    togglePanelBtn.innerHTML="☰";

  }else{

    mainPanel.classList.remove(
      "minimized"
    );

    togglePanelBtn.innerHTML="✖";
  }
};

</script>

</body>
</html>
